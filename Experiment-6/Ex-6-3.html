<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 6.3 - Font Size Mouse Events</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    #para { font-size: 16px; padding: 15px; background: #f9f9f9; border: 1px solid #ddd; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="6th-Exercise.html">&larr; All Exp 6 Exercises</a>
  </div>
  <h2>Exercise 6.3: Font Size on Mouse Events</h2>

  <p id="para" onmouseover="incSize()" onmouseout="decSize()">
    Hover over this text to increase font size, move out to decrease font size.
  </p>

  <script>
    function incSize() {
      document.getElementById("para").style.fontSize = "26px";
    }
    function decSize() {
      document.getElementById("para").style.fontSize = "16px";
    }
  </script>
</body>
</html>
