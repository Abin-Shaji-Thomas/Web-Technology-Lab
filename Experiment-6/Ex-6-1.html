<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex 6.1 — Digital Clock | Experiment 6</title>
  <style>
    :root{--bg:#f9f5f0;--card:#fff;--bd:#ddd4c0;--tx:#1e1208;--sub:#5c3c22;--mu:#9a7a5a;--ac:#a0521a;--r:10px}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
    h1{font-family:Georgia,serif}
    .wrap{max-width:720px;margin:0 auto;padding:0 24px}
    .topbar{background:var(--card);border-bottom:1px solid var(--bd)}
    .tb{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;max-width:720px;margin:0 auto}
    .tb a{font-size:13px;font-weight:600;color:var(--sub);text-decoration:none}
    .tb a:hover{color:var(--ac)}
    .tb span{font-size:12px;color:var(--mu)}
    .ex-head{background:var(--card);border-bottom:1px solid var(--bd);padding:30px 0 26px}
    .ex-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ac);margin-bottom:8px}
    .ex-head h1{font-size:24px;color:var(--tx);margin-bottom:6px}
    .ex-obj{font-size:13px;color:var(--sub);max-width:540px}
    main{flex:1;padding:32px 0 48px}

    .clock-h{font-family:Georgia,serif;font-size:18px;color:var(--sub);margin-bottom:14px}
    .clock-box{display:inline-block;padding:20px 36px;background:#fff;border:1.5px solid var(--bd);border-radius:var(--r);font-family:Georgia,serif;font-size:56px;font-weight:700;color:var(--sub);letter-spacing:.04em;min-width:280px;text-align:center}

    .bot-nav{background:var(--card);border-top:1px solid var(--bd);padding:14px 0}
    .bn{display:flex;justify-content:space-between;align-items:center;padding:0 24px;max-width:720px;margin:0 auto}
    .bn a{font-size:13px;font-weight:600;color:var(--sub);text-decoration:none;padding:6px 12px;border:1px solid var(--bd);border-radius:6px;background:#fff}
    .bn a:hover{color:var(--ac);border-color:var(--ac)}
    .bn .center{border-color:transparent;color:var(--mu);font-size:12px;background:none}
    .bn .center:hover{color:var(--ac)}
  </style>
</head>
<body>
<nav class="topbar">
  <div class="tb">
    <a href="6th-Exercise.html">← All Exercises</a>
    <span>Exercise 1 of 5</span>
  </div>
</nav>
<header class="ex-head">
  <div class="wrap">
    <p class="ex-tag">Exercise 01</p>
    <h1>Digital Clock</h1>
    <p class="ex-obj">Display a live digital clock using setInterval every 1 second and the JavaScript Date object methods: getHours(), getMinutes(), getSeconds().</p>
  </div>
</header>
<main>
  <div class="wrap">
    <h2 class="clock-h">Digital Clock!</h2>
    <div class="clock-box"><span id="time">--:--:--</span></div>
  </div>
</main>
<nav class="bot-nav">
  <div class="bn">
    <span style="visibility:hidden;">—</span>
    <a href="6th-Exercise.html" class="center">All Exercises</a>
    <a href="Ex-6-2.html">Dynamic Background →</a>
  </div>
</nav>
<script>
  // Define function display
  function display() {
    var d = new Date();
    var hours   = d.getHours();
    var minutes = d.getMinutes();
    var seconds = d.getSeconds();
    var hh = hours   < 10 ? "0" + hours   : hours;
    var mm = minutes < 10 ? "0" + minutes : minutes;
    var ss = seconds < 10 ? "0" + seconds : seconds;
    document.getElementById("time").innerHTML = hh + ":" + mm + ":" + ss;
  }
  display(); // run immediately
  // Call display function for every one second
  setInterval(display, 1000);
</script>
</body>
</html>
