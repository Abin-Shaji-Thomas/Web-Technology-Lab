<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 6.1 - Digital Clock</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    .clock { font-size: 36px; font-weight: bold; font-family: monospace; padding: 15px; background: #eee; border-radius: 4px; display: inline-block; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="6th-Exercise.html">&larr; All Exp 6 Exercises</a>
  </div>
  <h2>Exercise 6.1: Digital Clock</h2>
  <div class="clock" id="clock">00:00:00</div>

  <script>
    function displayClock() {
      var d = new Date();
      var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
      h = h < 10 ? "0" + h : h;
      m = m < 10 ? "0" + m : m;
      s = s < 10 ? "0" + s : s;
      document.getElementById("clock").textContent = h + ":" + m + ":" + s;
    }
    displayClock();
    setInterval(displayClock, 1000);
  </script>
</body>
</html>
