<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 6.2 - Dynamic Background</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    button { padding: 6px 14px; background: #333; color: #fff; border: none; cursor: pointer; margin-right: 5px; }
    p { font-size: 14px; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="6th-Exercise.html">&larr; All Exp 6 Exercises</a>
  </div>
  <h2>Exercise 6.2: Dynamic Background Colour</h2>
  <p>Click Start to change body background color every 30 seconds using setInterval.</p>
  <button onclick="startBg()">Start</button>
  <button onclick="stopBg()">Stop</button>

  <p id="status">Status: Stopped</p>

  <script>
    var timer = null;
    function setBackgroundColor() {
      var r = Math.floor(Math.random() * 256);
      var g = Math.floor(Math.random() * 256);
      var b = Math.floor(Math.random() * 256);
      document.body.style.backgroundColor = "rgb(" + r + "," + g + "," + b + ")";
      document.getElementById("status").textContent = "Status: Running (rgb(" + r + "," + g + "," + b + "))";
    }
    function startBg() {
      if (!timer) {
        setBackgroundColor();
        timer = setInterval(setBackgroundColor, 30000);
      }
    }
    function stopBg() {
      if (timer) {
        clearInterval(timer);
        timer = null;
        document.body.style.backgroundColor = "#ffffff";
        document.getElementById("status").textContent = "Status: Stopped";
      }
    }
  </script>
</body>
</html>
