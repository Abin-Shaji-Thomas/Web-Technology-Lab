<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 6.5 - Student Array of Objects</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    ul { padding-left: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="6th-Exercise.html">&larr; All Exp 6 Exercises</a>
  </div>
  <h2>Exercise 6.5: Student Array of Objects</h2>

  <div id="student-list"></div>
  <div id="student-table"></div>

  <script>
    var students = [
      { name: "John", r_num: "UR13CS129", dob: "20-apr-1995" },
      { name: "Joseph", r_num: "UR13CS130", dob: "05-jan-1998" },
      { name: "Alice", r_num: "UR24CS006", dob: "12-mar-2002" },
      { name: "Meera", r_num: "UR24CS007", dob: "30-jun-2001" }
    ];

    var listHtml = "<p><b>Student Register Numbers:</b></p><ul>";
    for (var i = 0; i < students.length; i++) {
      listHtml += "<li>" + students[i].name + "'s Register Number is " + students[i].r_num + "</li>";
    }
    listHtml += "</ul>";
    document.getElementById("student-list").innerHTML = listHtml;

    var tableHtml = "<table><tr><th>Name</th><th>Reg No</th><th>DOB</th><th>DOB Category</th></tr>";
    for (var j = 0; j < students.length; j++) {
      var year = parseInt(students[j].dob.split("-")[2]);
      var cat = "";
      if (year < 2000) cat = "Born before 2000";
      else cat = "Born after 2000";
      tableHtml += "<tr><td>" + students[j].name + "</td><td>" + students[j].r_num + "</td><td>" + students[j].dob + "</td><td>" + cat + "</td></tr>";
    }
    tableHtml += "</table>";
    document.getElementById("student-table").innerHTML = tableHtml;
  </script>
</body>
</html>
