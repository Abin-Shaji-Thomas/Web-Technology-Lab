<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 6.4 - Moving Car Animation</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    button { padding: 6px 14px; background: #333; color: #fff; border: none; cursor: pointer; margin-right: 5px; }
    .road { width: 100%; height: 60px; background: #e0e0e0; border: 1px solid #ccc; position: relative; overflow: hidden; margin-top: 15px; }
    .car { position: absolute; left: 0px; top: 15px; width: 40px; height: 30px; background: #333; color: #fff; text-align: center; line-height: 30px; font-size: 12px; font-weight: bold; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="6th-Exercise.html">&larr; All Exp 6 Exercises</a>
  </div>
  <h2>Exercise 6.4: Moving Car Animation</h2>
  
  <button onclick="startMove()">Move</button>
  <button onclick="stopMove()">Stop</button>

  <div class="road" id="road">
    <div class="car" id="car">CAR</div>
  </div>

  <script>
    var carTimer = null;
    var carPos = 0;

    function moveRight() {
      var roadWidth = document.getElementById("road").offsetWidth;
      carPos += 2;
      if (carPos > roadWidth) carPos = 0;
      document.getElementById("car").style.left = carPos + "px";
      carTimer = setTimeout(moveRight, 10);
    }

    function startMove() {
      if (!carTimer) moveRight();
    }

    function stopMove() {
      if (carTimer) {
        clearTimeout(carTimer);
        carTimer = null;
      }
    }
  </script>
</body>
</html>
