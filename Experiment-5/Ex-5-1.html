<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 5.1 - Shortest and Longest Word</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    input[type="text"] { width: 100%; padding: 6px; margin: 10px 0; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
    button { padding: 6px 14px; background: #333; color: #fff; border: none; cursor: pointer; }
    .result { margin-top: 15px; padding: 10px; background: #f4f4f4; border-left: 3px solid #333; display: none; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="5th-Exercise.html">&larr; All Exp 5 Exercises</a>
  </div>
  <h2>Exercise 5.1: Shortest and Longest Word Finder</h2>
  <label for="str">Enter a string:</label>
  <input type="text" id="str" value="Web Development Tutorial">
  <button onclick="findWords()">Find Words</button>
  <div id="result" class="result"></div>

  <script>
    function findWords() {
      var str = document.getElementById("str").value.trim();
      if (!str) return;
      var words = str.split(" ").filter(function(w){ return w.length > 0; });
      var shortest = words[0], longest = words[0];
      for (var i = 1; i < words.length; i++) {
        if (words[i].length < shortest.length) shortest = words[i];
        if (words[i].length > longest.length) longest = words[i];
      }
      var res = document.getElementById("result");
      res.innerHTML = "Shortest word: <b>" + shortest + "</b><br>Longest word: <b>" + longest + "</b>";
      res.style.display = "block";
    }
  </script>
</body>
</html>
