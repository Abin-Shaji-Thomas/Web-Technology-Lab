<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex 5.1 — Shortest &amp; Longest Word | Experiment 5</title>
  <style>
    :root{--bg:#f9f5f0;--card:#fff;--bd:#ddd4c0;--tx:#1e1208;--sub:#5c3c22;--mu:#9a7a5a;--ac:#a0521a;--r:10px}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
    h1{font-family:Georgia,serif}
    .wrap{max-width:720px;margin:0 auto;padding:0 24px}

    .topbar{background:var(--card);border-bottom:1px solid var(--bd)}
    .tb{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;max-width:720px;margin:0 auto}
    .tb a{font-size:13px;font-weight:600;color:var(--sub);text-decoration:none}
    .tb a:hover{color:var(--ac)}
    .tb span{font-size:12px;color:var(--mu)}

    .ex-head{background:var(--card);border-bottom:1px solid var(--bd);padding:30px 0 26px}
    .ex-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ac);margin-bottom:8px}
    .ex-head h1{font-size:24px;color:var(--tx);margin-bottom:6px}
    .ex-obj{font-size:13px;color:var(--sub);max-width:540px}

    main{flex:1;padding:32px 0 48px}
    label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin-bottom:5px}
    input[type="text"]{padding:8px 12px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--tx);width:100%;max-width:380px;outline:none}
    input:focus{border-color:var(--ac)}
    .field{display:flex;flex-direction:column;gap:5px}
    .mt14{margin-top:14px}
    .btn{display:inline-block;padding:9px 20px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;border:none;cursor:pointer;background:var(--ac);color:#fff;transition:background .15s}
    .btn:hover{background:#b06020}

    .word-pair{display:none;flex-wrap:wrap;gap:10px;margin-top:18px}
    .word-chip{flex:1;min-width:130px;padding:14px 18px;background:#fff;border:1.5px solid var(--bd);border-radius:var(--r)}
    .wc-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
    .wc-val{font-size:22px;font-weight:700;margin-top:5px;color:var(--sub)}

    .bot-nav{background:var(--card);border-top:1px solid var(--bd);padding:14px 0}
    .bn{display:flex;justify-content:space-between;align-items:center;padding:0 24px;max-width:720px;margin:0 auto}
    .bn a{font-size:13px;font-weight:600;color:var(--sub);text-decoration:none;padding:6px 12px;border:1px solid var(--bd);border-radius:6px;background:#fff}
    .bn a:hover{color:var(--ac);border-color:var(--ac)}
    .bn .center{border-color:transparent;color:var(--mu);font-size:12px;background:none}
    .bn .center:hover{color:var(--ac)}
  </style>
</head>
<body>

<nav class="topbar">
  <div class="tb">
    <a href="5th-Exercise.html">← All Exercises</a>
    <span>Exercise 1 of 6</span>
  </div>
</nav>

<header class="ex-head">
  <div class="wrap">
    <p class="ex-tag">Exercise 01</p>
    <h1>Shortest &amp; Longest Word Finder</h1>
    <p class="ex-obj">Find the shortest and longest word within a given string by splitting it into an array using split() and comparing word lengths with .length</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="field">
      <label for="q1-input">Enter a String</label>
      <input type="text" id="q1-input" value="Web Development Tutorial" placeholder="e.g. Web Development Tutorial">
    </div>
    <div class="mt14">
      <button class="btn" id="btn-find">Find Words</button>
    </div>
    <div class="word-pair" id="word-result">
      <div class="word-chip">
        <div class="wc-lbl">Shortest Word</div>
        <div class="wc-val" id="shortest-word">—</div>
      </div>
      <div class="word-chip">
        <div class="wc-lbl">Longest Word</div>
        <div class="wc-val" id="longest-word">—</div>
      </div>
    </div>
  </div>
</main>

<nav class="bot-nav">
  <div class="bn">
    <span style="visibility:hidden;font-size:13px;">—</span>
    <a href="5th-Exercise.html" class="center">All Exercises</a>
    <a href="Ex-5-2.html">BMI Calculator →</a>
  </div>
</nav>

<script>
  function findWords() {
    var str = document.getElementById("q1-input").value.trim();
    if (!str) return;
    // Split string into an array of words
    var words = str.split(" ").filter(function(w){ return w.length > 0; });
    if (!words.length) return;
    var shortest = words[0], longest = words[0];
    for (var i = 1; i < words.length; i++) {
      // Compare lengths using .length property
      if (words[i].length < shortest.length) shortest = words[i];
      if (words[i].length > longest.length)  longest  = words[i];
    }
    document.getElementById("shortest-word").textContent = "'" + shortest + "'";
    document.getElementById("longest-word").textContent  = "'" + longest  + "'";
    document.getElementById("word-result").style.display = "flex";
  }
  document.getElementById("btn-find").addEventListener("click", findWords);
</script>
</body>
</html>
