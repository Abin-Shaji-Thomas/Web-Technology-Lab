<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 5.2 - BMI Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    input[type="text"] { padding: 6px; margin-top: 4px; border: 1px solid #ccc; font-size: 14px; }
    button { padding: 6px 14px; background: #333; color: #fff; border: none; cursor: pointer; margin-top: 12px; }
    .result { margin-top: 15px; padding: 10px; background: #f4f4f4; border-left: 3px solid #333; display: none; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="5th-Exercise.html">&larr; All Exp 5 Exercises</a>
  </div>
  <h2>Exercise 5.2: BMI Calculator</h2>
  <label for="weight">Weight (kg):</label>
  <input type="text" id="weight" placeholder="e.g. 70">
  
  <label for="height">Height (m):</label>
  <input type="text" id="height" placeholder="e.g. 1.75">
  <br>
  <button onclick="calcBMI()">Calculate BMI</button>

  <div id="result" class="result">
    <div id="bmi-score"></div>
    <div id="bmi-type"></div>
  </div>

  <script>
    function calcBMI() {
      var w = parseFloat(document.getElementById("weight").value);
      var h = parseFloat(document.getElementById("height").value);
      if (isNaN(w) || isNaN(h) || h <= 0) {
        alert("Please enter valid numbers");
        return;
      }
      var bmi = (w / (h * h)).toFixed(2);
      var type = "";
      if (bmi < 18) type = "Underweight";
      else if (bmi <= 25) type = "Normal";
      else if (bmi <= 30) type = "Overweight";
      else type = "Obese";

      document.getElementById("bmi-score").innerHTML = "BMI: <b>" + bmi + "</b>";
      document.getElementById("bmi-type").innerHTML = "Category: <b>" + type + "</b>";
      document.getElementById("result").style.display = "block";
    }
  </script>
</body>
</html>
