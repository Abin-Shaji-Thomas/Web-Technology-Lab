<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ex 5.3 — Fruit Farm | Experiment 5</title>
  <style>
    :root{--bg:#f9f5f0;--card:#fff;--bd:#ddd4c0;--tx:#1e1208;--sub:#5c3c22;--mu:#9a7a5a;--ac:#a0521a;--gr:#2d7a50;--r:10px}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
    h1{font-family:Georgia,serif}
    .wrap{max-width:720px;margin:0 auto;padding:0 24px}

    .topbar{background:var(--card);border-bottom:1px solid var(--bd)}
    .tb{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;max-width:720px;margin:0 auto}
    .tb a{font-size:13px;font-weight:600;color:var(--sub);text-decoration:none}
    .tb a:hover{color:var(--ac)}
    .tb span{font-size:12px;color:var(--mu)}

    .ex-head{background:var(--card);border-bottom:1px solid var(--bd);padding:30px 0 26px}
    .ex-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ac);margin-bottom:8px}
    .ex-head h1{font-size:24px;color:var(--tx);margin-bottom:6px}
    .ex-obj{font-size:13px;color:var(--sub);max-width:540px}

    main{flex:1;padding:32px 0 48px}
    label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin-bottom:5px}
    input[type="text"]{padding:8px 12px;border:1.5px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--tx);width:100%;max-width:100px;outline:none}
    input:focus{border-color:var(--gr)}
    .field{display:flex;flex-direction:column;gap:5px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
    .btn{display:inline-block;padding:9px 20px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;border:none;cursor:pointer;background:var(--gr);color:#fff;transition:background .15s}
    .btn:hover{background:#3a9060}

    #garden{margin-top:18px;display:grid;gap:5px}
    .fruit-cell{width:48px;height:48px;border-radius:8px;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:26px}

    .bot-nav{background:var(--card);border-top:1px solid var(--bd);padding:14px 0}
    .bn{display:flex;justify-content:space-between;align-items:center;padding:0 24px;max-width:720px;margin:0 auto}
    .bn a{font-size:13px;font-weight:600;color:var(--sub);text-decoration:none;padding:6px 12px;border:1px solid var(--bd);border-radius:6px;background:#fff}
    .bn a:hover{color:var(--ac);border-color:var(--ac)}
    .bn .center{border-color:transparent;color:var(--mu);font-size:12px;background:none}
    .bn .center:hover{color:var(--ac)}
  </style>
</head>
<body>

<nav class="topbar">
  <div class="tb">
    <a href="5th-Exercise.html">← All Exercises</a>
    <span>Exercise 3 of 6</span>
  </div>
</nav>

<header class="ex-head">
  <div class="wrap">
    <p class="ex-tag">Exercise 03</p>
    <h1>Fruit Farm</h1>
    <p class="ex-obj">Create a rectangular grid of fruit images. Each cell is randomly 🍎 apple or 🍊 orange with equal probability using Math.random().</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="row">
      <div class="field">
        <label for="rows">Rows</label>
        <input type="text" id="rows" placeholder="3">
      </div>
      <div class="field">
        <label for="columns">Columns</label>
        <input type="text" id="columns" placeholder="5">
      </div>
      <button class="btn" onclick="grow()">Plant Garden</button>
    </div>
    <div id="garden"></div>
  </div>
</main>

<nav class="bot-nav">
  <div class="bn">
    <a href="Ex-5-2.html">← BMI Calculator</a>
    <a href="5th-Exercise.html" class="center">All Exercises</a>
    <a href="Ex-5-4.html">Currency Converter →</a>
  </div>
</nav>

<script>
  function grow() {
    var rows    = parseInt(document.getElementById("rows").value);
    var columns = parseInt(document.getElementById("columns").value);
    if (isNaN(rows) || isNaN(columns) || rows < 1 || columns < 1) {
      alert("Enter valid rows and columns."); return;
    }
    if (rows > 15 || columns > 15) { alert("Max 15 each."); return; }

    // Create an array of fruit options
    var arr = ["🍎", "🍊"];

    var garden = document.getElementById("garden");
    garden.innerHTML = "";
    garden.style.gridTemplateColumns = "repeat(" + columns + ", 48px)";

    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < columns; c++) {
        // Generate random number in range — Math.floor(Math.random() * length)
        var number = Math.floor(Math.random() * arr.length);
        var cell = document.createElement("div");
        cell.className = "fruit-cell";
        cell.innerHTML = arr[number];
        garden.appendChild(cell);
      }
    }
  }
</script>
</body>
</html>
