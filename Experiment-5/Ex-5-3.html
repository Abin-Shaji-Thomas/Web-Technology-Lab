<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 5.3 - Fruit Farm Grid</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    label { display: inline-block; margin-top: 10px; font-size: 14px; }
    input[type="text"] { padding: 6px; margin: 4px 10px 4px 0; border: 1px solid #ccc; font-size: 14px; width: 60px; }
    button { padding: 6px 14px; background: #333; color: #fff; border: none; cursor: pointer; margin-top: 10px; }
    .grid { display: grid; gap: 4px; margin-top: 15px; }
    .cell { width: 36px; height: 36px; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; background: #fff; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="5th-Exercise.html">&larr; All Exp 5 Exercises</a>
  </div>
  <h2>Exercise 5.3: Fruit Farm Grid</h2>
  <label for="rows">Rows:</label>
  <input type="text" id="rows" value="3">
  <label for="cols">Columns:</label>
  <input type="text" id="cols" value="5">
  <br>
  <button onclick="plantGarden()">Generate Grid</button>

  <div id="garden" class="grid"></div>

  <script>
    function plantGarden() {
      var r = parseInt(document.getElementById("rows").value) || 0;
      var c = parseInt(document.getElementById("cols").value) || 0;
      var g = document.getElementById("garden");
      g.innerHTML = "";
      g.style.gridTemplateColumns = "repeat(" + c + ", 36px)";
      var items = ["A", "O"];
      for (var i = 0; i < r * c; i++) {
        var cell = document.createElement("div");
        cell.className = "cell";
        var val = items[Math.floor(Math.random() * items.length)];
        cell.textContent = val;
        cell.title = val === "A" ? "Apple" : "Orange";
        g.appendChild(cell);
      }
    }
  </script>
</body>
</html>
