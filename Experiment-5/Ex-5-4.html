<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 5.4 - Currency Converter</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    input[type="text"], select { padding: 6px; margin-top: 4px; border: 1px solid #ccc; font-size: 14px; }
    button { padding: 6px 14px; background: #333; color: #fff; border: none; cursor: pointer; margin-top: 12px; }
    .result { margin-top: 15px; padding: 10px; background: #f4f4f4; border-left: 3px solid #333; display: none; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="5th-Exercise.html">&larr; All Exp 5 Exercises</a>
  </div>
  <h2>Exercise 5.4: Currency Converter</h2>
  <label for="amt">Amount:</label>
  <input type="text" id="amt" placeholder="Enter amount">

  <label for="from">From:</label>
  <select id="from">
    <option>Indian Rupee</option>
    <option>US Dollar</option>
  </select>

  <label for="to">To:</label>
  <select id="to">
    <option>US Dollar</option>
    <option>Indian Rupee</option>
  </select>
  <br>
  <button onclick="convertCurrency()">Convert</button>

  <div id="result" class="result"></div>

  <script>
    function convertCurrency() {
      var amt = parseFloat(document.getElementById("amt").value);
      if (isNaN(amt)) { alert("Enter valid amount"); return; }
      var fromIdx = document.getElementById("from").selectedIndex;
      var from = document.getElementById("from").options[fromIdx].value;
      var toIdx = document.getElementById("to").selectedIndex;
      var to = document.getElementById("to").options[toIdx].value;

      var res = 0;
      if (from === "Indian Rupee" && to === "US Dollar") {
        res = (amt * 0.015).toFixed(4) + " USD";
      } else if (from === "US Dollar" && to === "Indian Rupee") {
        res = (amt * 67.12).toFixed(2) + " INR";
      } else {
        res = amt.toFixed(2) + " " + (from === "Indian Rupee" ? "INR" : "USD");
      }

      var out = document.getElementById("result");
      out.innerHTML = "Converted Amount: <b>" + res + "</b>";
      out.style.display = "block";
    }
  </script>
</body>
</html>
