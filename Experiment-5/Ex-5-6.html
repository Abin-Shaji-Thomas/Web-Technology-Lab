<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 5.6 - Birthday Cake Order Form</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    input[type="text"] { padding: 6px; margin-top: 4px; border: 1px solid #ccc; font-size: 14px; width: 80px; }
    .radio-group { margin-top: 10px; }
    .radio-group label { display: inline; margin-right: 15px; }
    button { padding: 6px 14px; background: #333; color: #fff; border: none; cursor: pointer; margin-top: 15px; }
    .result { margin-top: 15px; padding: 10px; background: #f4f4f4; border-left: 3px solid #333; display: none; font-size: 15px; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="5th-Exercise.html">&larr; All Exp 5 Exercises</a>
  </div>
  <h2>Exercise 5.6: Birthday Cake Order Form</h2>
  
  <label for="small">Half kg cakes (Rs. 100):</label>
  <input type="text" id="small" value="0">

  <label for="medium">One kg cakes (Rs. 200):</label>
  <input type="text" id="medium" value="0">

  <label for="large">Two kg cakes (Rs. 400):</label>
  <input type="text" id="large" value="0">

  <div class="radio-group">
    <p style="margin-bottom: 5px; font-weight: bold; font-size: 14px;">Select Tip:</p>
    <label><input type="radio" name="tip" value="10"> 10%</label>
    <label><input type="radio" name="tip" value="15" checked> 15%</label>
    <label><input type="radio" name="tip" value="20"> 20%</label>
  </div>

  <button id="calc-btn">Calculate Order</button>

  <div id="result" class="result"></div>

  <script>
    document.getElementById("calc-btn").addEventListener("click", function() {
      var s = parseInt(document.getElementById("small").value) || 0;
      var m = parseInt(document.getElementById("medium").value) || 0;
      var l = parseInt(document.getElementById("large").value) || 0;
      var tip = parseFloat(document.querySelector('input[name="tip"]:checked').value);
      var base = (s * 100) + (m * 200) + (l * 400);
      var total = (base * 1.09 * (1 + tip / 100)).toFixed(2);
      var res = document.getElementById("result");
      res.innerHTML = "Total Cost (including 9% tax & tip): <b>Rs. " + total + "</b>";
      res.style.display = "block";
    });
  </script>
</body>
</html>
