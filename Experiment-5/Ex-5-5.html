<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ex 5.5 - Coin Flip Counter</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #222; }
    .nav { margin-bottom: 20px; font-size: 14px; }
    .nav a { color: #0066cc; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    .coin { width: 60px; height: 60px; border-radius: 50%; background: #e0e0e0; border: 2px solid #888; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; margin: 15px 0; }
    button { padding: 6px 14px; background: #333; color: #fff; border: none; cursor: pointer; }
    p { font-size: 14px; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="5th-Exercise.html">&larr; All Exp 5 Exercises</a>
  </div>
  <h2>Exercise 5.5: Coin Flip Counter</h2>
  <div class="coin" id="coin">H</div>
  <button id="flip-btn">Flip Coin</button>

  <p>Heads Total: <span id="num_heads">0</span></p>
  <p>Tails Total: <span id="num_tails">0</span></p>

  <script>
    var hCount = 0, tCount = 0;
    document.getElementById("flip-btn").addEventListener("click", function() {
      var val = Math.floor(Math.random() * 2);
      var coin = document.getElementById("coin");
      if (val === 0) {
        coin.textContent = "H";
        hCount++;
      } else {
        coin.textContent = "T";
        tCount++;
      }
      document.getElementById("num_heads").textContent = hCount;
      document.getElementById("num_tails").textContent = tCount;
    });
  </script>
</body>
</html>
